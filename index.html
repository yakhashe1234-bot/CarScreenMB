ne;--bg:#000;--line:rgba(255,255,255,.14);--text:#f4f6f8;--dim:#8f99a6;--blue:#1e8cff;--red:#e5262c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:"Segoe UI","Helvetica Neue",Tahoma,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:active{opacity:.6}
svg{display:block}
.app{display:grid;grid-template-rows:calc(40px + 28px*var(--is)) 1fr calc(48px + 64px*var(--is));height:100%;padding:0 22px;background:#000;transform-origin:center center}

/* ===== الشريط العلوي ===== */
.top{display:flex;align-items:center;gap:20px;border-bottom:1px solid rgba(255,255,255,.07)}
.ic{width:calc(48px*var(--is));height:calc(48px*var(--is));display:grid;place-items:center}
.ic svg{width:calc(36px*var(--is));height:calc(36px*var(--is));fill:#fff}
.sep{width:1px;height:38px;background:var(--line)}
.sp{flex:1}
.top .t{font-size:34px;font-weight:400;letter-spacing:.2px}
.sig{display:flex;gap:4px;align-items:flex-end;height:26px}
.sig i{width:6px;background:#fff;border-radius:1px}
.off .sig i{background:#444}

/* ===== المحتوى ===== */
.main{position:relative;display:grid;gap:14px;min-height:0;padding:14px 0 12px}
.slot{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#0d1117,#06080b)}
.slot[data-slot=a]{grid-area:a}.slot[data-slot=b]{grid-area:b}.slot[data-slot=c]{grid-area:c}.slot[data-slot=d]{grid-area:d}
.w{position:absolute;inset:0}
#store{display:none}
.cover{position:absolute;inset:0;z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.6);border:2px dashed var(--blue);border-radius:24px;font-size:22px}
.cover small{color:var(--dim);font-size:16px}
[data-mode=edit] .cover{display:flex}

/* ===== الموسيقى ===== */
.w-music{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(12px,3vh,26px) clamp(14px,2.4vw,34px)}
.art{height:clamp(70px,24vh,170px);aspect-ratio:1/1;border-radius:6px;background:#10141b;border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;overflow:hidden}
.art svg{width:60%;fill:#9ea7b2}
.mt{text-align:center;width:100%}
#title{font-size:clamp(20px,4.4vh,38px);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{font-size:clamp(15px,3.2vh,26px);color:#8f99a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prog{width:100%;height:4px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:var(--blue);border-radius:2px}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 6%}
.ctl button{width:calc(60px*var(--is));height:calc(60px*var(--is));display:grid;place-items:center}
.ctl svg{width:calc(36px*var(--is));height:calc(36px*var(--is));fill:#fff}
.ctl .pp{width:calc(clamp(60px,12vh,88px)*var(--is));height:calc(clamp(60px,12vh,88px)*var(--is));border:2px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(255,255,255,.04)}
.ctl .pp svg{width:calc(38px*var(--is));height:calc(38px*var(--is))}

/* ===== الخريطة ===== */
.w-map{overflow:hidden;background:#05070a}
#map{position:absolute;inset:0;background:#05070a}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.62) contrast(1.35) saturate(0)}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#666!important;font-size:9px}
.leaflet-control-attribution a{color:#777!important}
.tilt #map{inset:auto;width:1800px;height:1800px;left:calc(50% - 900px);top:calc(78% - 900px);transition:transform .7s linear}
.w-map.tilt::before{content:"";position:absolute;inset:0 0 auto 0;height:55%;background:linear-gradient(#000 5%,rgba(0,0,0,0));z-index:500;pointer-events:none}
.carptr{position:absolute;left:50%;top:78%;width:76px;height:60px;margin:-30px 0 0 -38px;z-index:600;display:none;pointer-events:none;filter:drop-shadow(0 0 10px rgba(30,140,255,.8))}
.tilt .carptr{display:block}
.me{width:60px;height:48px}
.me svg{width:60px;height:48px;filter:drop-shadow(0 0 8px rgba(30,140,255,.9))}
.banner{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:20px;padding:12px 26px;background:rgba(9,12,17,.93);border:1px solid var(--line);border-radius:24px;margin:0}
.t-arrbox{width:56px;text-align:center}
.t-arr{font-size:50px;line-height:1;display:block}
.t-arrbox i{display:block;width:80px;height:1px;background:rgba(255,255,255,.35);margin:2px -12px 0}
.t-dist{font-size:clamp(26px,5.6vh,46px);font-weight:600;line-height:1.1}
.t-ins{font-size:clamp(18px,3.6vh,30px);text-align:left;direction:rtl;unicode-bidi:plaintext;font-weight:300}
.banner .x{margin-left:auto;font-size:26px;color:var(--dim);padding:8px;display:none}
.routing .banner .x{display:block}
.search{position:absolute;bottom:14px;left:14px;right:14px;z-index:1000;display:none;gap:10px}
[data-mode=nav] .search{display:flex}
.search input{flex:1;min-width:0;font:inherit;font-size:24px;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(9,12,17,.96);color:#fff;user-select:text;-webkit-user-select:text}
.go{background:var(--blue);border-radius:18px;padding:0 30px;font-size:24px;font-weight:600;color:#fff}
.loc{position:absolute;right:14px;bottom:14px;z-index:1000;width:calc(60px*var(--is));height:calc(60px*var(--is));border-radius:50%;background:rgba(9,12,17,.93);border:1px solid var(--line);display:grid;place-items:center}
.loc svg{width:calc(30px*var(--is));height:calc(30px*var(--is));fill:#fff}
[data-mode=nav] .loc{bottom:92px}
.msg{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:1000;background:rgba(9,12,17,.96);border:1px solid var(--line);padding:10px 18px;border-radius:14px;font-size:17px;display:none;max-width:85%;text-align:center}
#navFull{position:absolute;inset:0 0 12px 0;z-index:2500;display:none;border-radius:24px;overflow:hidden;border:1px solid var(--line)}
[data-mode=nav] #navFull{display:block}
#navFull .w-map{position:absolute;inset:0}

/* ===== السرعة ===== */
.w-speed{display:flex;align-items:center;justify-content:space-around;padding:8px}
.limit{width:clamp(70px,22vh,118px);aspect-ratio:1;border-radius:50%;background:#fff;border:clamp(7px,2vh,12px) solid var(--red);display:grid;place-items:center;color:#111;font-weight:800;font-size:clamp(26px,6.6vh,48px);letter-spacing:-1px}
.sv{text-align:center}
.sv b{display:block;font-size:clamp(50px,13vh,92px);font-weight:500;line-height:1}
.sv span{font-size:clamp(16px,3vh,26px)}
.over .sv b{color:#ff5a5f}

/* ===== السيارة / الصورة ===== */
.w-car{background:#07090c var(--carimg) center/cover no-repeat}
.w-photo{background:#07090c var(--photo) center/cover no-repeat;display:grid;place-items:center;color:var(--dim);font-size:22px}
.vcar{background:#07090c var(--carimg) center/cover no-repeat;border-radius:18px}

/* ===== ويدجتات إضافية ===== */
.w-clock,.w-weather,.w-turn,.w-trip,.w-logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center}
.big{font-size:clamp(46px,16vh,120px);font-weight:300;line-height:1}
.mid{font-size:clamp(20px,4vh,34px);color:#c3cad2}
.small{font-size:clamp(15px,2.8vh,22px);color:var(--dim)}
.w-turn .t-arr{font-size:clamp(60px,18vh,120px)}
.w-turn .t-dist{font-size:clamp(34px,9vh,70px)}
.w-turn .t-ins{text-align:center}
.w-weather .em{font-size:clamp(46px,14vh,90px);line-height:1}
.w-compass{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.w-compass svg{width:min(70%,56vh,100%);max-height:70%}
.cmp-rose{transform-origin:50% 50%;transition:transform .5s linear}
.w-trip .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;width:100%;max-width:420px}
.w-trip .row2 div{background:rgba(255,255,255,.04);border-radius:12px;padding:8px}
.w-trip b{display:block;font-size:clamp(22px,5vh,38px);font-weight:500}
.w-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;align-content:center}
.w-apps button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:14px 4px;font-size:clamp(14px,2.6vh,20px);display:flex;flex-direction:column;align-items:center;gap:6px}
.w-apps button span{font-size:clamp(26px,5vh,40px)}
.w-logo img{width:min(60%,40vh)}

/* ===== شاشات إضافية ===== */
.layer{position:absolute;inset:0 0 12px 0;z-index:2000;display:none;flex-direction:column;gap:10px;background:#000;border:1px solid var(--line);border-radius:24px;overflow:hidden}
[data-mode=media] #mediaL,[data-mode=veh] #dataL,[data-mode=vset] #vehL{display:flex}
.layer h2{margin:0;font-size:28px;font-weight:400}
.lh{padding:16px 22px 0}
.list{flex:1;overflow:auto;padding:6px 14px}
.list div{padding:16px 14px;font-size:24px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list div.on{background:rgba(30,140,255,.2);color:#6db4ff}
.list .empty{color:var(--dim);text-align:center;padding:40px 10px}
.row{display:flex;gap:12px;padding:0 16px 16px}
.row button{flex:1;padding:18px;border-radius:16px;border:1px solid var(--line);background:#0e1218;font-size:22px}
.row .go{background:var(--blue);border:0}
.vbody{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px 16px;min-height:0}
.vbtns{display:flex;flex-direction:column;gap:10px;overflow:auto}
.vbtns button{padding:15px;border-radius:14px;border:1px solid var(--line);background:#0e1218;font-size:20px;flex:0 0 auto}
.vbtns .go{border:0}

/* ===== شريط التخصيص ===== */
.editbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4000;display:none;align-items:center;gap:12px;padding:12px 16px;border-radius:22px;background:#0b0e13;border:1px solid var(--line);box-shadow:0 8px 40px #000}
[data-mode=edit] .editbar{display:flex}
.lay{width:76px;height:56px;border-radius:10px;border:2px solid var(--line);padding:5px}
.lay.on{border-color:var(--blue)}
.mini{display:grid;gap:3px;width:100%;height:100%}
.mini i{background:#5b6672;border-radius:3px}
.editbar .lang{padding:12px 16px;border:1px solid var(--line);border-radius:12px;font-size:20px}
.editbar .go{padding:14px 28px;font-size:22px}
.picker{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
.picker.on{display:flex}
.pbox{width:min(92vw,980px);max-height:88vh;overflow:auto;background:#0b0e13;border:1px solid var(--line);border-radius:24px;padding:20px}
.pbox h3{margin:0 0 14px;font-size:26px;font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pgrid button{padding:18px 8px;border-radius:16px;border:1px solid var(--line);background:#10151c;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pgrid button span{font-size:38px}
.pgrid button.on{border-color:var(--blue);background:rgba(30,140,255,.15)}

/* ===== الشريط السفلي ===== */
.dock{display:grid;grid-template-columns:26% 14% 20% 14% 26%;align-items:center;position:relative;background:radial-gradient(ellipse 60% 100% at 50% 100%,rgba(255,255,255,.06),transparent)}
.dock::before{content:"";position:absolute;left:3%;right:3%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45) 50%,transparent)}
.dock>button{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;font-size:calc(clamp(16px,3vh,26px)*(.6 + .4*var(--is)));font-weight:300}
.dock svg{width:calc(40px*var(--is));height:calc(40px*var(--is));fill:#fff}
.dock .home{padding:0;margin:0 auto}
.dock .home img{width:calc(96px*var(--is));height:calc(94px*var(--is));display:block;pointer-events:none}
[data-mode=nav] .dock .b-nav,[data-mode=media] .dock .b-media,[data-mode=veh] .dock .b-veh,[data-mode=vset] .dock .b-veh{color:#7bbcff}
[data-mode=nav] .dock .b-nav svg,[data-mode=media] .dock .b-media svg,[data-mode=veh] .dock .b-veh svg,[data-mode=vset] .dock .b-veh svg{fill:#7bbcff}
.glow{position:absolute;bottom:0;height:3px;width:24%;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:0 0 22px 2px rgba(30,140,255,.7);opacity:0;transition:opacity .2s,left .2s}
.glow.b-phone{left:1%;opacity:1}.glow.b-nav{left:21%;opacity:1}.glow.b-media{left:55%;opacity:1}.glow.b-veh{left:75%;opacity:1}
.glow.b-home{opacity:0}

.dh{display:flex;justify-content:space-between;align-items:center;padding-right:18px}
.chip{padding:10px 22px;border:1px solid var(--line);border-radius:14px;font-size:20px;background:#0e1218}
.ggrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:10px;padding:0 14px;min-height:0}
.gauge{position:relative;border:1px solid var(--line);border-radius:18px;background:#0a0d12;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0;min-width:0;overflow:hidden}
.gauge svg{height:84%;max-width:100%;margin-top:2%}
.gv{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(24px,6.4vh,52px);font-weight:500;line-height:1}
.gv small{font-size:.42em;color:var(--dim);margin-left:4px}
.gl{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:clamp(14px,2.7vh,21px);color:var(--dim)}
.obdbar{display:flex;gap:10px;align-items:center;padding:0 14px 14px;flex-wrap:wrap}
.obdbar input{font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0e1218;color:#fff;width:190px;user-select:text;-webkit-user-select:text}
.obdbar input.pt{width:100px}
.obdbar button{padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:#0e1218;font-size:20px}
.obdbar .go{background:var(--blue);border:0}
#obdSt{color:var(--dim);font-size:18px}
.w-gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.w-gauges .gauge{border:0;background:none}
.sl{padding:6px 4px}.sl label{display:flex;justify-content:space-between;font-size:20px;margin-bottom:4px}
.sl input{width:100%;accent-color:var(--blue);height:34px}

/* ===== المظهر + لون التطبيق + نمط الخريطة ===== */
:root{--blue-rgb:30,140,255;--blue-l:#7bbcff}
.glow{box-shadow:0 0 22px 2px rgba(var(--blue-rgb),.7)}
.carptr{filter:drop-shadow(0 0 10px rgba(var(--blue-rgb),.8))}
.me svg{filter:drop-shadow(0 0 8px rgba(var(--blue-rgb),.9))}
.list div.on{background:rgba(var(--blue-rgb),.2);color:var(--blue-l)}
.pgrid button.on{background:rgba(var(--blue-rgb),.15)}
[data-mode=nav] .dock .b-nav,[data-mode=media] .dock .b-media,[data-mode=veh] .dock .b-veh,[data-mode=vset] .dock .b-veh{color:var(--blue-l)}
[data-mode=nav] .dock .b-nav svg,[data-mode=media] .dock .b-media svg,[data-mode=veh] .dock .b-veh svg,[data-mode=vset] .dock .b-veh svg{fill:var(--blue-l)}
.w-compass svg path[fill="#1e8cff"]{fill:var(--blue)}
.opt{padding:2px 0}
.opt>label{display:block;font-size:18px;color:var(--dim);margin:2px 2px 6px}
.vbtns .seg{display:flex;gap:8px}
.vbtns .seg button{flex:1;padding:12px 6px;font-size:18px;border-radius:12px}
.vbtns .seg button.on{background:var(--blue);border-color:transparent;color:#fff}
.vbtns .sw{display:flex;gap:12px;flex-wrap:wrap;padding:2px}
.vbtns .sw button{width:46px;height:46px;border-radius:50%;padding:0;border:3px solid transparent}
.vbtns .sw button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}

/* ===== شاشة كاملة + الصوت + التوجيه ===== */
.app{position:relative}
#full{position:absolute;inset:0;z-index:4000;display:none;background:#000}
[data-mode=vfull] #full,[data-mode=mfull] #full{display:block}
html[data-theme=day] [data-mode=mfull] #full{background:#eef1f5}
.fbar{position:absolute;top:14px;right:14px;z-index:20;display:flex;gap:14px}
.fbar button{width:calc(64px*var(--is));height:calc(64px*var(--is));border-radius:50%;background:rgba(20,24,30,.74);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;font-size:26px}
.fbar svg{width:34px;height:34px;fill:#fff}
.fbar img{width:72%;height:72%;object-fit:contain}
#full .art{height:clamp(120px,36vh,400px)}
#full #title{font-size:clamp(28px,6vh,56px)}
#full #artist{font-size:clamp(20px,3.8vh,34px)}
.mfl{display:none;position:absolute;left:16px;top:14px;z-index:5;width:56px;height:56px;border-radius:50%;background:rgba(128,128,128,.22);font-size:26px;place-items:center;color:var(--text)}
[data-mode=mfull] .mfl{display:grid}
[data-mode=vfull] .w-video.has .vchg{display:block;right:auto;left:14px}
#volPop{position:absolute;top:calc(40px + 28px*var(--is) + 8px);left:50%;transform:translateX(-50%);z-index:5000;display:none;align-items:center;gap:18px;width:min(720px,86%);padding:14px 22px;border-radius:22px;background:rgba(14,18,24,.97);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#volPop.on{display:flex}
#volPop button{width:56px;height:56px;display:grid;place-items:center;flex:none}
#volPop svg{width:36px;height:36px;fill:#fff}
#volPop input{flex:1;height:44px;accent-color:var(--blue)}
#volPop b{width:70px;text-align:right;font-size:26px;font-weight:500}
html[data-theme=day] #volPop{background:rgba(255,255,255,.98)}
html[data-theme=day] #volPop svg{fill:#12171d}
.w-turn .t-arr{font-size:clamp(60px,22vh,150px);color:var(--blue-l);line-height:1}
.w-turn .x{position:absolute;top:10px;right:10px;font-size:26px;color:var(--dim);padding:10px;display:none}
.routing .w-turn .x{display:block}
.limit{position:relative}
.limit.auto::after{content:"A";position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:16px;font-weight:700;display:grid;place-items:center;letter-spacing:0}

/* ويدجت الفيديو */
.w-video{background:#000;display:grid;place-items:center}
.w-video video{width:100%;height:100%;object-fit:contain;display:none;background:#000}
.w-video.has video{display:block}
.vph{color:#9aa4b0;font-size:22px;text-align:center;padding:14px}
.w-video.has .vph{display:none}
.vchg{position:absolute;top:8px;right:8px;z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;display:none}
[data-mode=home] .w-video.has .vchg{display:block}

/* خريطة نهارية */
html[data-map=day] .leaflet-tile-pane{filter:none}
html[data-map=day] .w-map,html[data-map=day] #map{background:#e5e3df}
html[data-map=day] .w-map.tilt::before{background:linear-gradient(#e5e3df 5%,rgba(229,227,223,0))}
html[data-map=day] .leaflet-control-attribution{background:rgba(255,255,255,.75)!important;color:#555!important}
html[data-map=day] .leaflet-control-attribution a{color:#444!important}

/* مظهر نهاري */
html[data-theme=day]{--bg:#eef1f5;--line:rgba(0,0,0,.15);--text:#12171d;--dim:#5b6672}
html[data-theme=day],html[data-theme=day] body,html[data-theme=day] .app{background:#eef1f5;color:#12171d}
html[data-theme=day] .top{border-bottom-color:rgba(0,0,0,.1)}
html[data-theme=day] .ic svg,html[data-theme=day] .dock svg,html[data-theme=day] .ctl svg,html[data-theme=day] .loc svg{fill:#12171d}
html[data-theme=day] .sig i{background:#12171d}
html[data-theme=day] .off .sig i{background:#aab2bc}
html[data-theme=day] .slot{background:linear-gradient(180deg,#fff,#f1f4f8)}
html[data-theme=day] .layer{background:#eef1f5}
html[data-theme=day] .cover{background:rgba(255,255,255,.75)}
html[data-theme=day] .dock{background:radial-gradient(ellipse 60% 100% at 50% 100%,rgba(0,0,0,.06),transparent)}
html[data-theme=day] .dock::before{background:linear-gradient(90deg,transparent,rgba(0,0,0,.35) 50%,transparent)}
html[data-theme=day] .row button,html[data-theme=day] .vbtns button,html[data-theme=day] .chip,html[data-theme=day] .obdbar input,html[data-theme=day] .obdbar button,html[data-theme=day] .search input,html[data-theme=day] .banner,html[data-theme=day] .loc,html[data-theme=day] .msg,html[data-theme=day] .pbox,html[data-theme=day] .pgrid button,html[data-theme=day] .editbar,html[data-theme=day] .gauge,html[data-theme=day] .editbar .lang{background:#fff;color:#12171d}
html[data-theme=day] .banner,html[data-theme=day] .msg,html[data-theme=day] .loc{background:rgba(255,255,255,.96)}
html[data-theme=day] .editbar{box-shadow:0 8px 40px rgba(0,0,0,.25)}
html[data-theme=day] .w-apps button,html[data-theme=day] .w-trip .row2 div{background:rgba(0,0,0,.05);color:#12171d}
html[data-theme=day] .w-gauges .gauge{background:none}
html[data-theme=day] .gauge circle:not(.gar){stroke:rgba(0,0,0,.1)}
html[data-theme=day] .art{background:#e4e8ee;border-color:rgba(0,0,0,.08)}
html[data-theme=day] .art svg{fill:#5b6672}
html[data-theme=day] .prog{background:rgba(0,0,0,.14)}
html[data-theme=day] .ctl .pp{border-color:rgba(0,0,0,.35);background:rgba(0,0,0,.04)}
html[data-theme=day] .mid{color:#3b444e}
html[data-theme=day] .mini i{background:#a8b2be}
html[data-theme=day] .t-arrbox i{background:rgba(0,0,0,.35)}
html[data-theme=day] .w-compass svg [stroke="#fff"]{stroke:#12171d}
html[data-theme=day] .w-compass svg circle{stroke:rgba(0,0,0,.25)}
html[data-theme=day] .w-compass svg text[fill="#fff"]{fill:#12171d}
html[data-theme=day] .go,html[data-theme=day] .row .go,html[data-theme=day] .vbtns .go,html[data-theme=day] .obdbar .go,html[data-theme=day] .editbar .go{background:var(--blue);color:#fff}
html[data-theme=day] .vbtns .seg button.on{background:var(--blue);color:#fff}
html[data-theme=day] .list div.on{color:var(--blue)}

/* ===== 3D map button + NTG main menu ===== */
.m3d{position:absolute;right:14px;bottom:calc(14px + 60px*var(--is) + 12px);z-index:1000;width:calc(60px*var(--is));height:calc(60px*var(--is));border-radius:50%;background:rgba(9,12,17,.93);border:1px solid var(--line);display:grid;place-items:center;font-size:calc(22px*var(--is));font-weight:700;color:#fff}
.m3d.on{color:var(--blue-l);border-color:var(--blue)}
[data-mode=nav] .m3d{display:none}
.w-map.tilt0::before{display:none}
html[data-theme=day] .m3d{background:rgba(255,255,255,.96);color:#12171d}
html[data-theme=day] .m3d.on{color:var(--blue)}
#ntg{position:absolute;inset:0;z-index:5500;display:none;flex-direction:column;background:radial-gradient(ellipse 90% 70% at 50% 0%,#1d2736,#07090d 72%);-webkit-user-select:none;user-select:none}
#ntg.on{display:flex}
.ntgh{display:flex;align-items:center;justify-content:space-between;padding:22px 34px 12px}
.ntgh h2{margin:0;font-size:32px;font-weight:300;letter-spacing:.05em}
.ntgh button{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);font-size:26px;background:rgba(255,255,255,.06)}
.ntgl{height:1px;margin:0 34px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55) 50%,transparent)}
.ntgg{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:18px;padding:24px 34px 34px;min-height:0}
.ntgg button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:22px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));font-size:clamp(18px,3.4vh,28px);font-weight:300;min-height:0}
.ntgg button svg{width:clamp(44px,10vh,78px);height:clamp(44px,10vh,78px);fill:#e8edf2}
.ntgg button.on{border-color:var(--blue);background:linear-gradient(180deg,rgba(var(--blue-rgb),.28),rgba(var(--blue-rgb),.06));color:var(--blue-l)}
.ntgg button.on svg{fill:var(--blue-l)}
.ntgg button.on::after{content:"";position:absolute;bottom:0;left:14%;right:14%;height:3px;background:var(--blue);box-shadow:0 0 18px rgba(var(--blue-rgb),.85)}
html[data-theme=day] #ntg{background:radial-gradient(ellipse 90% 70% at 50% 0%,#ffffff,#d5dbe3 72%);color:#12171d}
html[data-theme=day] .ntgh button,html[data-theme=day] .ntgg button{border-color:rgba(0,0,0,.18);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(0,0,0,.03))}
html[data-theme=day] .ntgg button svg{fill:#12171d}
html[data-theme=day] .ntgg button.on svg{fill:var(--blue)}
html[data-theme=day] .ntgg button.on{color:var(--blue)}
html[data-theme=day] .ntgl{background:linear-gradient(90deg,transparent,rgba(0,0,0,.35) 50%,transparent)}
.dock .home,#fStar{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html[data-layer=sat] .leaflet-tile-pane{filter:brightness(.85)}
#mediaL .row{flex-wrap:wrap;gap:10px}
</style>
</head>
<body>
<div class="app" id="app" data-mode="home">

  <div class="top" id="top">
    <button class="ic" id="bHome" aria-label="home"><svg viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H4v9h6v-6h4v6h6v-9h2.500z"/></svg></button>
    <div class="sep"></div>
    <button class="ic" id="bBack" aria-label="back"><svg viewBox="0 0 24 24"><path d="M10 3 3 9.500 10 16v-4.200h5.500a3.500 3.500 0 0 1 0 7H12V21h3.500a5.500 5.500 0 0 0 0-11H10z"/></svg></button>
    <button class="ic" id="bVol" aria-label="volume"><svg class="vsv" viewBox="0 0 24 24"></svg></button>
    <div class="sp"></div>
    <div class="sig" id="sig"><i style="height:7px"></i><i style="height:12px"></i><i style="height:18px"></i><i style="height:25px"></i></div>
    <div class="t" id="time">--:--</div>
    <div class="sep"></div>
    <div class="t" id="temp">--°C</div>
  </div>

  <div class="main" id="main">
    <div class="slot" data-slot="a"><div class="cover" data-for="a"></div></div>
    <div class="slot" data-slot="b"><div class="cover" data-for="b"></div></div>
    <div class="slot" data-slot="c"><div class="cover" data-for="c"></div></div>
    <div class="slot" data-slot="d"><div class="cover" data-for="d"></div></div>

    <div id="navFull"></div>

    <div class="layer" id="mediaL">
      <div class="lh"><h2 data-i="plist"></h2></div>
      <div class="list" id="list"></div>
      <div class="row"><button class="go" id="pick" data-i="add"></button><button id="pickDir" data-i="addDir"></button><button id="clrList" data-i="clrList"></button></div>
    </div>

    <div class="layer" id="dataL">
      <div class="lh dh"><h2 data-i="vdata"></h2><button class="chip" id="toSet" data-i="settings"></button></div>
      <div class="ggrid" id="ggrid"></div>
      <div class="obdbar">
        <input id="obdHost" value="192.168.0.10" aria-label="host"><input class="pt" id="obdPort" value="35000" inputmode="numeric" aria-label="port">
        <button class="go" id="obdBtn"></button><button id="demoBtn"></button><span id="obdSt"></span>
      </div>
    </div>

    <div class="layer" id="vehL">
      <div class="lh dh"><h2 data-i="settings"></h2><button class="chip" id="toData" data-i="vdata"></button></div>
      <div class="vbody">
        <div class="vcar"></div>
        <div class="vbtns">
          <button class="go" id="carPick" data-i="carPick"></button>
          <button id="carReset" data-i="carReset"></button>
          <button class="go" id="customBtn" data-i="custom"></button>
          <button class="go" id="ntgBtn" data-i="mainMenu"></button>
          <div class="opt"><label data-i="theme"></label><div class="seg" id="segTheme"><button data-v="night" data-i="themeNight"></button><button data-v="day" data-i="themeDay"></button><button data-v="auto" data-i="themeAuto"></button></div></div>
          <div class="opt"><label data-i="accent"></label><div class="sw" id="swAcc"></div></div>
          <div class="opt"><label data-i="mapStyle"></label><div class="seg" id="segMap"><button data-v="auto" data-i="mapAuto"></button><button data-v="day" data-i="mapDay"></button><button data-v="night" data-i="mapNight"></button></div></div>
          <div class="opt"><label data-i="mapType"></label><div class="seg" id="segLay"><button data-v="std" data-i="lStd"></button><button data-v="sat" data-i="lSat"></button><button data-v="ter" data-i="lTer"></button></div></div>

  const mp={'left':['←','انعطف يسار'],'right':['→','انعطف يمين'],'slight left':['↖','انعطف قليلاً يسار'],'slight right':['↗','انعطف قليلاً يمين'],'sharp left':['↰','انعطف حاداً يسار'],'sharp right':['↱','انعطف حاداً يمين'],'uturn':['↶','استدر للخلف'],'straight':['↑','استمر مباشرة']};
  if(ty==='fork')return m.includes('left')?['↖','خذ المسار الأيسر']:['↗','خذ المسار الأيمن'];

async function routeTo(to,name){
  if(!lastLL){say(LANG?'انتظر تحديد موقعك (GPS)':'Waiting for GPS fix');return}
  dest={ll:to,name};
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${lastLL[1]},${lastLL[0]};${to[1]},${to[0]}?overview=full&geometries=geojson&steps=true`;

    const r=j.routes[0];
    coordsArr=r.geometry.coordinates.map(c=>[c[1],c[0]]);
    steps=r.legs[0].steps;stepIdx=0;
    if(routeLine){routeLine.remove();routeGlow.remove()}
    routeGlow=L.polyline(coordsArr,{color:ACC(),weight:22,opacity:.25,lineJoin:'round'}).addTo(map);
    routeLine=L.polyline(coordsArr,{color:ACC(),weight:10,opacity:1,lineJoin:'round'}).addTo(map);

  }catch(e){say(LANG?'تحقق من الإنترنت':'Check your internet connection')}
}
function updateRoute(ll){
  if(!steps.length)return;
  while(stepIdx<steps.length-1&&hav(ll,[steps[stepIdx+1].maneuver.location[1],steps[stepIdx+1].maneuver.location[0]])<30)stepIdx++;
  const mv=steps[Math.min(stepIdx+1,steps.length-1)].maneuver;
  const target=[mv.location[1],mv.location[0]];
  const [a,ins]=instr(mv);const d=hav(ll,target);
  setTurn(a,fmtDist(d),ins);
  if(mv.type==='arrive'&&d<40){stopNav();say(LANG?'وصلت إلى وجهتك':'You have arrived');return}
  let min=1e9;for(let i=0;i<coordsArr.length;i+=3){const x=hav(ll,coordsArr[i]);if(x<min)min=x}
  if(min>180&&Date.now()-lastReroute>15000&&dest){lastReroute=Date.now();say(LANG?'إعادة حساب المسار...':'Rerouting...');routeTo(dest.ll,dest.name)}
}
function stopNav(){
  steps=[];dest=null;coordsArr=[];
  if(routeLine){routeLine.remove();routeGlow.remove();routeLine=null}
  app.classList.remove('routing');setTurn('↑','--',t('noRoute'));
}

const LIMITS=[30,40,50,60,80,100,120,140];
let limit=100,limGot=false,limQ={t:0,ll:null};try{limit=+localStorage.getItem('limit')||100}catch(e){}
function showLimit(){$('limit').textContent=dispSpd(limit);$('limit').classList.toggle('auto',cfg.limm==='auto'&&limGot)}

/* حد السرعة التلقائي من بيانات الخريطة (OpenStreetMap) */
function ptSeg(p,a,b){
  const k=Math.cos(rad(p[0])),X=q=>[(q[1]-p[1])*111320*k,(q[0]-p[0])*110540];
  const A=X(a),B=X(b),dx=B[0]-A[0],dy=B[1]-A[1],l2=dx*dx+dy*dy;
  let u=l2?((-A[0])*dx+(-A[1])*dy)/l2:0;u=Math.max(0,Math.min(1,u));
  return Math.hypot(A[0]+u*dx,A[1]+u*dy);
}
function parseMax(v){
  if(!v)return 0;const m=String(v).match(/(\d+(?:\.\d+)?)\s*(mph)?/i);if(!m)return 0;
  let n=parseFloat(m[1]);n=m[2]?Math.round(n*1.609):Math.round(n);
  return n>=5&&n<=200?n:0;
}
async function autoLimit(ll,kmh){
  if(cfg.limm!=='auto')return;
  const now=Date.now();
  if(now-limQ.t<8000)return;
  if(limQ.ll&&hav(ll,limQ.ll)<60)return;
  if(kmh<3&&limGot)return;
  limQ={t:now,ll};
  const q=`[out:json][timeout:8];way(around:30,${ll[0].toFixed(5)},${ll[1].toFixed(5)})["highway"]["maxspeed"];out tags geom;`;
  let j=null;
  for(const host of ['https://overpass-api.de','https://overpass.kumi.systems']){
    try{const r=await fetch(host+'/api/interpreter?data='+encodeURIComponent(q));if(r.ok){j=await r.json();break}}catch(e){}
  }
  if(!j||!j.elements)return;
  let best=0,bd=1e9;
  j.elements.forEach(el=>{
    const v=parseMax(el.tags&&el.tags.maxspeed);if(!v||!el.geometry||el.geometry.length<2)return;
    let d=1e9;for(let i=0;i<el.geometry.length-1;i++){const a=el.geometry[i],b=el.geometry[i+1];d=Math.min(d,ptSeg(ll,[a.lat,a.lon],[b.lat,b.lon]))}
    if(d<bd){bd=d;best=v}
  });
  if(best){limGot=true;setLimit(best,true)}
}

/* ================= وحدات: الساعة / الحرارة / السرعة ================= */
function fmtTime(d){
  if(cfg.clk==='12'){const h=d.getHours();return (h%12||12)+':'+pad(d.getMinutes())+' '+(h<12?(LANG?'ص':'AM'):(LANG?'م':'PM'))}
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function kmToU(k){return cfg.su==='mph'?k*0.621371:k}
function dispSpd(k){return Math.round(kmToU(k))}
let wxData=null;
function fmtT(c){return cfg.tu==='F'?(c*9/5+32):c}
function renderWx(){
  if(!wxData)return;
  const w=WX[wxData.code]||WX[2],u=cfg.tu==='F'?'°F':'°C';
  $('temp').textContent=fmtT(wxData.t).toFixed(1)+u;
  $('wx-t').textContent=Math.round(fmtT(wxData.t))+'°';$('wx-em').textContent=w[2];$('wx-d').textContent=w[LANG];
  $('wx-w').textContent=Math.round(kmToU(wxData.w))+' '+(cfg.su==='mph'?'mph':'km/h');
}
function applyUnits(){
  const sp=document.querySelector('.sv span');if(sp)sp.textContent=cfg.su==='mph'?'mph':'km/h';
  showLimit();renderWx();tick();
}
function paintSegs(){[['segClk','clk'],['segTu','tu'],['segSu','su'],['segLim','limm']].forEach(([id,k])=>document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(cfg[k]))))}
function bindSeg(id,key,after){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg[key]=b.dataset.v;save();paintSegs();if(after)after()}}
bindSeg('segClk','clk',()=>tick());
bindSeg('segTu','tu',()=>renderWx());
bindSeg('segSu','su',()=>applyUnits());
bindSeg('segLim','limm',()=>{
  limGot=false;
  if(cfg.limm==='manual'){try{limit=+localStorage.getItem('limit')||100}catch(e){}showLimit()}
  else{limQ={t:0,ll:null};showLimit();if(lastLL)autoLimit(lastLL,10)}
});

/* ================= التحكم بالصوت ================= */
const VOLP={base:'<path d="M3 9v6h4l5 5V4L7 9H3z"/>',lo:'<path d="M16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>',hi:'<path d="M14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>',x:'<rect x="15" y="11" width="8" height="2" rx="1" transform="rotate(45 19 12)"/><rect x="15" y="11" width="8" height="2" rx="1" transform="rotate(-45 19 12)"/>'};
let curVol=50,preMute=50,volT=null;
function getVol(){try{if(window.Android&&Android.getVol)return Android.getVol()}catch(e){}return Math.round(audio.volume*100)}
function paintVol(){
  let h=VOLP.base;if(curVol===0)h+=VOLP.x;else{h+=VOLP.lo;if(curVol>50)h+=VOLP.hi}
  document.querySelectorAll('.vsv').forEach(sv=>sv.innerHTML=h);
  $('volR').value=curVol;$('volV').textContent=curVol+'%';
}
function bumpVol(){clearTimeout(volT);volT=setTimeout(()=>$('volPop').classList.remove('on'),5000)}
function setVol(p){
  p=Math.max(0,Math.min(100,Math.round(p)));curVol=p;
  try{if(window.Android&&Android.setVol)Android.setVol(p);else{audio.volume=p/100;vid.volume=p/100;welAudio.volume=p/100}}catch(e){}
  paintVol();bumpVol();
}
function toggleVol(){const pop=$('volPop');if(pop.classList.contains('on')){pop.classList.remove('on');return}curVol=getVol();paintVol();pop.classList.add('on');bumpVol()}
$('bVol').onclick=e=>{e.stopPropagation();toggleVol()};
$('fVol').onclick=e=>{e.stopPropagation();toggleVol()};
$('volR').oninput=()=>setVol(+$('volR').value);
$('volMute').onclick=()=>{if(curVol>0){preMute=curVol;setVol(0)}else setVol(preMute||40)};
document.addEventListener('pointerdown',e=>{if($('volPop').classList.contains('on')&&!e.target.closest('#volPop,#bVol,#fVol'))$('volPop').classList.remove('on')});
setInterval(()=>{if($('volPop').classList.contains('on')){const v=getVol();if(v!==curVol){curVol=v;paintVol()}}},2000);
curVol=getVol();paintVol();

/* ================= تشغيل ================= */
$('logoImg').src=document.querySelector('#bHome2 img').src;$('fStarImg').src=$('logoImg').src;

/* ================= قائمة مرسيدس الرئيسية (NTG 5.0) + إعدادات الخريطة 3D ================= */
function paint3d(){
  document.querySelectorAll('#seg3d button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.m3d));
  document.querySelectorAll('#segRot button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.mrot));
  $('tdR').value=cfg.tdeg;$('tdV').textContent=cfg.tdeg+'°';
  document.querySelectorAll('#segLay button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.mlay));
  const mb=$('m3d');mb.textContent=cfg.m3d==='on'?'3D':'2D';mb.classList.toggle('on',cfg.m3d==='on');
}
$('seg3d').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.m3d=b.dataset.v;save();paint3d();setTilt(true)};
$('segRot').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.mrot=b.dataset.v;save();paint3d();applyTilt()};
$('tdR').oninput=e=>{cfg.tdeg=+e.target.value;save();paint3d();applyTilt()};
$('m3d').onclick=()=>{cfg.m3d=cfg.m3d==='on'?'off':'on';save();paint3d();setTilt(true);say(cfg.m3d==='on'?(LANG?'خريطة 3D':'3D map'):(LANG?'خريطة 2D':'2D map'),1500)};

const NTG_ICON={nav:'bNav',media:'bMedia',phone:'bPhone',veh:'bVeh'};
Object.keys(NTG_ICON).forEach(k=>{const sv=document.querySelector('#ntgg [data-go="'+k+'"] svg'),src=$(NTG_ICON[k]).querySelector('svg');if(sv&&src)sv.innerHTML=src.innerHTML});
const NTG_ACT={nav:()=>setMode('nav'),media:()=>setMode('media'),phone:()=>openExt('tel:'),veh:()=>setMode('veh'),set:()=>setMode('vset'),home:()=>setMode('home')};
function openNtg(){
  const cur={nav:'nav',media:'media',veh:'veh',vset:'set',home:'home'}[app.dataset.mode];
  document.querySelectorAll('#ntgg button').forEach(b=>b.classList.toggle('on',b.dataset.go===cur));

[$('bHome2'),$('fStar')].forEach(el=>{

  el.addEventListener('pointerdown',()=>{ntgLP=0;clearTimeout(tm);tm=setTimeout(()=>{ntgLP=1;openNtg()},650)});

/* ===== نوع الخريطة + إضافة أغاني متعددة / مجلد كامل (محفوظة) ===== */
$('segLay').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.mlay=b.dataset.v;save();paint3d();setBase()};
const AUD=/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|wma|amr)$/i,trkSig=new Set();
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const saveIdx=()=>idb.set('trkIdx',tracks.map(x=>x.id)).catch(()=>{});
async function addFiles(list){
  const fs=[...list].filter(f=>(f.type&&f.type.startsWith('audio/'))||AUD.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const first=tracks.length;let n=0,full=false;
  for(const f of fs){
    const sig=f.name+'|'+f.size;if(trkSig.has(sig))continue;trkSig.add(sig);
    const nm=f.name.replace(/\.[^.]+$/,''),p=nm.split(' - ');
    const tr={id:newId(),sig,title:p.length>1?p.slice(1).join(' - '):nm,artist:p.length>1?p[0]:t('noArtist'),url:URL.createObjectURL(f)};
    tracks.push(tr);n++;
    try{await idb.set('trk:'+tr.id,{blob:f,sig,title:tr.title,artist:tr.artist})}catch(e){full=true}
  }
  saveIdx();renderList();
  if(!n){say(LANG?'ما لقيت ملفات صوت':'No audio files found');return}
  say((LANG?'تمت إضافة ':'Added ')+n+(LANG?' أغنية':' songs')+(full?(LANG?' (التخزين ممتلئ، للجلسة فقط)':' (storage full, this session only)'):''));
  if(idx<0&&tracks.length){load(first,true);setMode('home')}
}
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('dirFile').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('pickDir').onclick=()=>$('dirFile').click();
$('clrList').onclick=async()=>{
  const ids=tracks.map(x=>x.id);tracks=[];idx=-1;trkSig.clear();
  audio.pause();audio.removeAttribute('src');audio.load();
  $('title').textContent=t('noTrack');$('artist').textContent=t('noArtist');$('pb').style.width='0';
  renderList();for(const id of ids){try{await idb.del('trk:'+id)}catch(e){}}saveIdx();
};
(async()=>{try{
  const ids=(await idb.get('trkIdx'))||[];
  for(const id of ids){const r=await idb.get('trk:'+id);if(r&&r.blob){trkSig.add(r.sig);tracks.push({id,sig:r.sig,title:r.title,artist:r.artist,url:URL.createObjectURL(r.blob)})}}
  if(tracks.length){renderList();if(idx<0)load(0,false)}
}catch(e){}})();

place();applyLang();applyScale();applyTheme();paintWel();applyUnits();paintSegs();paint3d();setTurn('↑','--',t('noRoute'));setTilt(true);tick();setInterval(tick,5000);
document.body.addEventListener('contextmenu',e=>e.preventDefault());
</script>
