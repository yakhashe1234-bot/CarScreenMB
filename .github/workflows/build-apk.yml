name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q CarScreen-AndroidProject.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: project/CarScreen
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp project/CarScreen/app/build/outputs/apk/debug/app-debug.apk CarScreen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CarScreen-apk
          path: CarScreen.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarScreen build
